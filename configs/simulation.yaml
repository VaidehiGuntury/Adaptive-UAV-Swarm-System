# Paper 1 (DEBS) — self-aggregation exploration simulation
# Layer 2/3 settings are intentionally absent in this iteration.

environment:
  width: 100.0
  height: 100.0
  obstacle_count: 20
  obstacle_min_radius: 1.5
  obstacle_max_radius: 4.0
  obstacle_seed: 42

uav:
  # Paper 1 dynamics (Sec. 2.3, experiments)
  max_speed: 1.5
  max_angular_velocity: 0.9
  sensing_range: 4.5
  initial_spread_radius: 20.0
  spawn_mode: ring
  spawn_angular_noise: 0.15

aggregation:
  # Paper 1 Eq. (7) utility U_a distance thresholds
  d_c: 0.5
  d_0: 12.0
  k_a: 1.0
  turn_cost_weight: 1.0
  # Eq. (10) trail penalty — raised after geographic trail fix (see docs/assumptions.md)
  trail_penalty: 8.0
  # Composite viewpoint cost weights (Sec. 5 — BSA + navigation + penalty)
  candidates_per_frontier: 6
  replan_interval: 2.0
  mission_region_radius: 17.8   # fair-share radius for 10 UAVs on 100x100 map
                                 # sqrt(10000/10/π) = 17.8m
  cluster_penalty_weight: 2.0   # increase from 1.0 — J_C needs more influence
                                 # to compete with frontier utility
  trail_penalty_weight: 1.0     # unchanged
  turn_penalty_weight: 0.5      # unchanged

simulation:
  num_uavs: 10
  dt: 0.1
  duration: 120.0
  spawn_center_x: 50.0
  spawn_center_y: 50.0
  animation_interval_ms: 50

# IDE allocation (DEBS §4 — Algorithms 1 & 2)
# Remove or comment this block to disable IDE entirely.
ide:
  alpha: 0.5              # Eq. 2-3 adaptive schedule parameter
  population_size: 20     # Population N per pairwise interaction
  fe_max: 200             # Max function evaluations (paper value)
  t_att: 2.0              # Min inter-interaction gap in seconds
  d_star: 30.0            # Desired separation (revised from paper's
                          # 9.0m — see Stage 4 Q6 resolution:
                          # fair-share radius on 100x100 map = 17.8m,
                          # d_star = 2 * 17.8 = 35.6m, rounded to 30.0m
                          # for headroom)
  communication_range: 50.0   # ← paper Rcomm = 50m
  bounds_padding: 0.5     # LHS sampling boundary margin
  seed: 42                # Fixed seed for reproducibility